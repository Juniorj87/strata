<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Strata — automated trading strategies, settled on-chain</title>
    <meta
      name="description"
      content="Strata turns trading rules into contracts on Asentum. Choose a strategy, fund it, and let the network run the schedule. Your wallet signs every step."
    />
    <meta name="theme-color" content="#06080B" />
    <meta property="og:title" content="Strata — automated trading strategies, settled on-chain" />
    <meta
      property="og:description"
      content="Launch DCA, grid, take-profit, stop-loss or TWAP strategies as on-chain contracts. No servers, no keepers, full custody of your wallet."
    />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;450;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <script>
      try {
        var storedTheme = localStorage.getItem('strata-theme');
        if (storedTheme === 'light' || storedTheme === 'dark') {
          document.documentElement.setAttribute('data-theme', storedTheme);
        }
      } catch (error) {
        /* storage can be blocked; the dark default still applies */
      }
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
